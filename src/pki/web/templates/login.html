{% extends "base.html" %}
{% block title %}Admin login | MiniPKI{% endblock %}
{% block content %}
<section class="page">
  <h1>Admin login</h1>
  <p class="lede">
    Needed to issue or revoke certificates. Password comes from
    <code>MINIPKI_ADMIN_PASSWORD</code> in <code>.env</code>.
  </p>

  <form method="post" class="panel">
    <input type="hidden" name="next" value="{{ next_url }}">
    <label>
      Password
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn">Log in</button>
  </form>
</section>
{% endblock %}
