[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minipki"
version = "0.1.0"
description = "Lightweight X.509 Public Key Infrastructure MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0",
    "flask>=3.0.0",
    "Flask-SQLAlchemy>=3.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pki.web" = ["templates/*", "static/*"]
