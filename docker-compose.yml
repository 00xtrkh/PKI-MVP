services:
  minipki:
    build: .
    image: minipki:latest
    container_name: minipki
    ports:
      - "${MINIPKI_PUBLISH_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      MINIPKI_HOST: "0.0.0.0"
      MINIPKI_PORT: "5000"
      MINIPKI_DEBUG: "0"
      MINIPKI_STORAGE_DIR: /data
    volumes:
      - minipki-data:/data
    restart: unless-stopped

volumes:
  minipki-data:
